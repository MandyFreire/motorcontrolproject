<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 945" width="1120" height="945" font-family="Helvetica, Arial, sans-serif">
  <title>Esquema de ligação – Arduino Uno, L298N, motor DC com encoder</title>
  <style>
    .caixa { fill: #f4f6f8; stroke: #263238; stroke-width: 2; }
    .titulo { font-size: 17px; font-weight: bold; fill: #263238; }
    .pino { font-size: 13px; fill: #263238; }
    .pinob { font-size: 13px; font-weight: bold; fill: #263238; }
    .nota { font-size: 13.5px; fill: #263238; }
    .rot { font-size: 12px; fill: #37474f; }
    .alerta { font-size: 12.5px; font-weight: bold; fill: #c62828; }
    .fio { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .pot { fill: none; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
    .ponto { stroke: #263238; stroke-width: 1.5; fill: #fff; }
  </style>
  <rect width="1120" height="945" fill="#ffffff"/>

  <text x="560" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">Esquema de ligação – controle de velocidade de motor DC</text>
  <text x="560" y="58" text-anchor="middle" class="rot">Pinos conforme arduino/motor_control/motor_control.ino · cores dos fios apenas ilustrativas</text>

  <!-- ===================== FIOS (desenhados antes das caixas) ===================== -->
  <!-- Encoder A -> D2 -->
  <path class="fio" stroke="#2e7d32" d="M1040 230 V150 H300"/>
  <text x="660" y="143" class="rot" fill="#2e7d32">encoder canal A → D2 (INT0)</text>
  <!-- Encoder B -> D3 -->
  <path class="fio" stroke="#1565c0" d="M990 230 V185 H300"/>
  <text x="660" y="203" class="rot" fill="#1565c0">encoder canal B → D3 (INT1)</text>

  <!-- D9 -> ENA, D7 -> IN1, D8 -> IN2 -->
  <path class="fio" stroke="#ef6c00" d="M300 265 H470"/>
  <text x="385" y="258" text-anchor="middle" class="rot" fill="#ef6c00">PWM</text>
  <path class="fio" stroke="#f9a825" d="M300 300 H470"/>
  <text x="385" y="293" text-anchor="middle" class="rot" fill="#b28704">sentido</text>
  <path class="fio" stroke="#8d6e63" d="M300 335 H470"/>
  <text x="385" y="328" text-anchor="middle" class="rot" fill="#6d4c41">sentido</text>

  <!-- OUT1/OUT2 -> motor -->
  <path class="pot" stroke="#c62828" d="M720 300 H860"/>
  <path class="pot" stroke="#212121" d="M720 345 H860"/>
  <text x="790" y="290" text-anchor="middle" class="rot">armadura</text>

  <!-- Fonte 12 V -> L298N -->
  <path class="pot" stroke="#c62828" d="M520 640 V470"/>
  <path class="pot" stroke="#212121" d="M600 640 V470"/>
  <text x="510" y="612" text-anchor="end" class="rot" fill="#c62828">+12 V</text>
  <text x="610" y="612" class="rot">GND</text>

  <!-- GND comum: L298N GND -> Arduino GND -->
  <path class="fio" stroke="#212121" stroke-width="4" d="M600 560 H532 A12 12 0 0 0 508 560 H390 V480 H300"/>
  <circle cx="600" cy="560" r="6" fill="#212121"/>
  <text x="450" y="534" text-anchor="middle" class="alerta">GND COMUM</text>
  <text x="450" y="550" text-anchor="middle" class="alerta">(obrigatório)</text>

  <!-- Encoder VCC (5 V do Arduino) e GND -->
  <path class="fio" stroke="#d81b60" d="M890 470 V745 H350 V445 H300"/>
  <text x="620" y="738" text-anchor="middle" class="rot" fill="#d81b60">5 V do Arduino → VCC do encoder</text>
  <path class="fio" stroke="#212121" d="M940 470 V775 H330 V515 H300"/>
  <text x="620" y="792" text-anchor="middle" class="rot">GND do Arduino → GND do encoder</text>

  <!-- ===================== ARDUINO UNO ===================== -->
  <rect class="caixa" x="60" y="110" width="240" height="460" rx="10" fill="#e3f2fd"/>
  <text x="180" y="138" text-anchor="middle" class="titulo">Arduino Uno</text>
  <text x="180" y="156" text-anchor="middle" class="rot">ATmega328P · 16 MHz</text>
  <rect x="38" y="380" width="34" height="46" rx="4" fill="#90a4ae" stroke="#263238"/>
  <text x="30" y="445" class="rot">USB</text>
  <text x="80" y="470" class="rot">alimentação +</text>
  <text x="80" y="486" class="rot">serial 115200</text>
  <text x="80" y="502" class="rot">→ computador</text>
  <g class="pino" text-anchor="end">
    <text x="290" y="155">D2</text>
    <text x="290" y="190">D3</text>
    <text x="290" y="270">D9 ~</text>
    <text x="290" y="305">D7</text>
    <text x="290" y="340">D8</text>
    <text x="290" y="450">5V</text>
    <text x="290" y="485">GND</text>
    <text x="290" y="520">GND</text>
  </g>
  <g>
    <circle class="ponto" cx="300" cy="150" r="5"/><circle class="ponto" cx="300" cy="185" r="5"/>
    <circle class="ponto" cx="300" cy="265" r="5"/><circle class="ponto" cx="300" cy="300" r="5"/>
    <circle class="ponto" cx="300" cy="335" r="5"/><circle class="ponto" cx="300" cy="445" r="5"/>
    <circle class="ponto" cx="300" cy="480" r="5"/><circle class="ponto" cx="300" cy="515" r="5"/>
  </g>

  <!-- ===================== L298N ===================== -->
  <rect class="caixa" x="470" y="230" width="250" height="240" rx="10" fill="#fff3e0"/>
  <text x="595" y="258" text-anchor="middle" class="titulo">Ponte H L298N</text>
  <g class="pino">
    <text x="480" y="270">ENA</text>
    <text x="480" y="305">IN1</text>
    <text x="480" y="340">IN2</text>
    <text x="710" y="305" text-anchor="end">OUT1</text>
    <text x="710" y="350" text-anchor="end">OUT2</text>
    <text x="520" y="455" text-anchor="middle">+12V</text>
    <text x="600" y="455" text-anchor="middle">GND</text>
    <text x="680" y="455" text-anchor="middle">+5V</text>
  </g>
  <text x="530" y="385" class="alerta">retire o jumper de ENA</text>
  <text x="530" y="402" class="rot">(senão o PWM não tem efeito)</text>
  <g>
    <circle class="ponto" cx="470" cy="265" r="5"/><circle class="ponto" cx="470" cy="300" r="5"/>
    <circle class="ponto" cx="470" cy="335" r="5"/><circle class="ponto" cx="720" cy="300" r="5"/>
    <circle class="ponto" cx="720" cy="345" r="5"/><circle class="ponto" cx="520" cy="470" r="5"/>
    <circle class="ponto" cx="600" cy="470" r="5"/><circle class="ponto" cx="680" cy="470" r="5"/>
  </g>
  <path d="M680 476 V500" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="688" y="497" class="rot">não ligar</text>

  <!-- ===================== MOTOR + ENCODER ===================== -->
  <rect class="caixa" x="860" y="230" width="210" height="240" rx="10" fill="#e8f5e9"/>
  <text x="965" y="258" text-anchor="middle" class="titulo">Motor DC</text>
  <text x="965" y="276" text-anchor="middle" class="rot">com encoder em quadratura</text>
  <circle cx="945" cy="345" r="38" fill="#cfd8dc" stroke="#263238" stroke-width="2"/>
  <text x="945" y="352" text-anchor="middle" font-size="22" font-weight="bold" fill="#263238">M</text>
  <rect x="983" y="338" width="34" height="14" fill="#90a4ae" stroke="#263238"/>
  <rect x="1017" y="318" width="10" height="54" fill="#66bb6a" stroke="#263238"/>
  <text x="1022" y="392" text-anchor="middle" class="rot">disco</text>
  <g class="pino">
    <text x="870" y="296">M+</text>
    <text x="870" y="370">M−</text>
    <text x="890" y="456" text-anchor="middle">VCC</text>
    <text x="940" y="456" text-anchor="middle">GND</text>
    <text x="998" y="222" font-size="12" font-weight="bold">B</text>
    <text x="1048" y="222" font-size="12" font-weight="bold">A</text>
  </g>
  <g>
    <circle class="ponto" cx="860" cy="300" r="5"/><circle class="ponto" cx="860" cy="345" r="5"/>
    <circle class="ponto" cx="890" cy="470" r="5"/><circle class="ponto" cx="940" cy="470" r="5"/>
    <circle class="ponto" cx="990" cy="230" r="5"/><circle class="ponto" cx="1040" cy="230" r="5"/>
  </g>

  <!-- ===================== FONTE ===================== -->
  <rect class="caixa" x="470" y="640" width="250" height="62" rx="8" fill="#ffebee"/>
  <text x="595" y="668" text-anchor="middle" class="titulo">Fonte 12 V DC</text>
  <text x="595" y="688" text-anchor="middle" class="rot">corrente ≥ corrente de partida do motor</text>
  <text x="520" y="636" text-anchor="middle" class="pinob" fill="#c62828">+</text>
  <text x="612" y="636" class="pinob">−</text>
  <circle class="ponto" cx="520" cy="640" r="5"/><circle class="ponto" cx="600" cy="640" r="5"/>

  <!-- ===================== NOTAS ===================== -->
  <rect x="40" y="815" width="1040" height="118" rx="8" fill="#fafafa" stroke="#b0bec5"/>
  <text x="56" y="838" class="nota" font-weight="bold">Antes de ligar a fonte de 12 V:</text>
  <text x="56" y="860" class="nota">1. GND da fonte, da L298N e do Arduino interligados. Sem isso, ENA/IN1/IN2 ficam sem referência.</text>
  <text x="56" y="880" class="nota">2. Arduino alimentado pelo USB. Não ligue o +5V da L298N ao 5V do Arduino. Mantenha o jumper do regulador da L298N (fonte ≤ 12 V).</text>
  <text x="56" y="900" class="nota">3. Confira no datasheet se o encoder aceita 5 V (alguns são de 3,3 V). Saídas em coletor aberto funcionam: o firmware ativa os pull-ups.</text>
  <text x="56" y="918" class="rot">Se a velocidade medida sair negativa com tensão positiva: troque ENC_SENTIDO para -1 no sketch (ou inverta OUT1/OUT2 e confira de novo).</text>
</svg>
